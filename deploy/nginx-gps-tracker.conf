# /etc/nginx/sites-available/gps-tracker   (replace track.arifdev.com with your domain)
#
# This is the plain-HTTP starting point. Run `certbot --nginx -d track.arifdev.com`
# afterwards: it obtains the Let's Encrypt certificate, adds the 443 server block
# and the http -> https redirect automatically.

# Lets WebSocket upgrades through while keeping normal requests as plain HTTP/1.1
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name track.arifdev.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # lets the app set Secure cookies

        # WebSocket (live position updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
